name: traffic-views

on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-views-chart:
    name: Update GitHub Traffic Views Chart (stats branch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Fetch /traffic/views and update orphan stats branch
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$TRAFFIC_TOKEN" ]; then
            echo "::notice::TRAFFIC_TOKEN secret is not set; skipping automatic traffic chart update. Add a fine-grained PAT with Administration: Read as repository secret TRAFFIC_TOKEN to enable daily updates."
            exit 0
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $TRAFFIC_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/traffic/views" > "$work/traffic.json"

          if git ls-remote --exit-code --heads origin stats >/dev/null 2>&1; then
            git clone --depth 1 --branch stats "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git" "$work/stats"
          else
            git init "$work/stats"
            git -C "$work/stats" checkout --orphan stats
            git -C "$work/stats" remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${REPO}.git"
          fi

          python scripts/ci/render_views_chart.py \
            --history "$work/stats/views-history.json" \
            --traffic "$work/traffic.json" \
            --out-light "$work/stats/views-light.svg" \
            --out-dark "$work/stats/views-dark.svg" \
            --repo "$REPO"

          cd "$work/stats"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add views-history.json views-light.svg views-dark.svg
          if ! git diff --cached --quiet; then
            git commit -m "stats: update repository views chart"
            git push origin stats
          else
            echo "No changes to views chart."
          fi
